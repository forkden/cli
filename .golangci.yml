version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - revive
    - gosec
    - nilerr
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
formatters:
  enable:
    - gofmt
    - goimports
